[package]
name = "imaging-part"
version = "1.0.0"
edition = "2021"
publish = false

[lib]
name = "imaging_part"
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = "1"
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Standalone crate: never absorbed into an enclosing cargo workspace.
[workspace]

[dependencies.image]
version = "0.25"
default-features = false
features = ["png", "jpeg", "gif", "webp", "bmp"]

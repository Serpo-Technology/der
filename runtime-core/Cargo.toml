[package]
name = "der-runtime"
version = "0.1.0"
edition = "2021"
description = "The DER runtime kernel: transforms, expressions, operations, sessions, view resolution, validation, streaming recovery, and the compose orchestration, with no host dependencies so it builds native and for wasm32."
license = "AGPL-3.0-or-later"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
chrono = { version = "0.4", default-features = false, features = ["std", "alloc", "serde", "clock"] }
regex = "1.13.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
uuid = { version = "1.0", features = ["v4"] }
rand = "0.8"

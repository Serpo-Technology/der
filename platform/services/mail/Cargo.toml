[package]
name = "der-mail"
version = "0.1.0"
edition = "2021"
description = "DER's mail service: the mail account and its password, sending over SMTP, and reading over IMAP, with no dependency on the desktop shell."
license = "AGPL-3.0-or-later"

[dependencies]
der-wire = { path = "../wire" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lettre = { version = "0.11.22", default-features = false, features = ["smtp-transport", "builder", "rustls-tls"] }
imap = { version = "2", default-features = false }
mailparse = "0.16.1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "0.26"

[dev-dependencies]
tempfile = "3"

[package]
name = "der-wire"
version = "0.1.0"
edition = "2021"
description = "The line protocol between DER's host and its service processes: one JSON request per line in, one JSON reply per line out, matched by id."
license = "AGPL-3.0-or-later"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

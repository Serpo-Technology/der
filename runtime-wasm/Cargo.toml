[package]
name = "der-runtime-kernel"
version = "0.1.0"
edition = "2021"
description = "The DER runtime kernel compiled to wasm32: the same der_alloc/der_run JSON envelope the parts speak, plus one host_call import for operation dispatch and entropy."
license = "Apache-2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
der-runtime = { path = "../runtime-core" }
serde_json = { version = "1", features = ["preserve_order"] }

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
codegen-units = 1
